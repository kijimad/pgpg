services:
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pg-experiment:
    build: .
    environment:
      PG_BACKEND: postgres://postgres@postgres/postgres
      PG_PROXY_HOST: 0.0.0.0
      PG_PROXY_PORT: 15432
      PG_MODE: echo
    ports:
      - "15432:15432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  pg-plan-image:
    build: .
    environment:
      PG_BACKEND: postgres://postgres@postgres/postgres
      PG_PROXY_HOST: 0.0.0.0
      PG_PROXY_PORT: 15431
      PG_MODE: plan-image
      PG_PLAN_IMAGE_DIR: /images
      PG_PLAN_IMAGE_LINK_PREFIX: images/
    user: "${PLAN_UID:-1000}:${PLAN_GID:-1000}"
    volumes:
      - ${PLAN_IMAGE_HOST_DIR:-${HOME}/roam/images}:/images
    ports:
      - "15431:15431"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
